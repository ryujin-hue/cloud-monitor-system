name: Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dry-run deploy of the cron Worker
        run: npm run dry-run:worker
      - name: Dry-run deploy of the Pages project
        run: npm run dry-run:pages

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci

      # The `secrets` context is NOT available in the `if` of a step, so the check is
      # done once and its result is passed on through an output.
      - name: Detect the Cloudflare credentials
        id: credentials
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the cron Worker
        if: steps.credentials.outputs.available == 'true'
        run: npm run deploy:worker

      - name: Deploy the Pages project
        if: steps.credentials.outputs.available == 'true'
        run: npm run deploy:pages

      - name: Report that the deployment was skipped
        if: steps.credentials.outputs.available != 'true'
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN is not configured, the backend was NOT deployed."
          echo "::notice::Add the secret to enable automatic deployments."
