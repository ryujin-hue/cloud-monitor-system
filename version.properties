# Manual version component for the whole monorepo.
#
# versionCode = `git rev-list --count HEAD`   (monotonic; CI must use `fetch-depth: 0`)
# versionName = MAJOR.MINOR.<commit count>
#
# Bump MAJOR/MINOR here only when you want a human-visible version step.
# Everything else is automatic and requires no manual edits.
MAJOR=1
MINOR=0

# Used only when the build cannot read git history AND it is not running in CI.
# CI hard-fails instead of using this value, because a wrong versionCode would break
# in-place updates over an already published APK.
FALLBACK_VERSION_CODE=1
