# ---------------------------------------------------------------------------
# Gradle
#
# The build is tuned to run inside a small container (3 GB RAM). The Kotlin compiler
# runs INSIDE the Gradle daemon (`kotlin.compiler.execution.strategy=in-process`) so that
# only one JVM is needed instead of a Gradle daemon plus a separate Kotlin daemon.
#
# Robolectric (used by the Room migration tests) additionally loads a full Android
# runtime into memory, so nothing else may run while the tests execute.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx512m
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# ---------------------------------------------------------------------------
# AndroidX / AGP
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# AGP 9 enables "built-in Kotlin" by default, which pins the Kotlin Gradle Plugin to the
# version AGP bundles (2.2.10). We opt out so that we can use Kotlin 2.4.21 / KSP 2.3.13,
# which are required to read the bytecode metadata of Ktor 3.6.1 (stdlib 2.3.21) and
# kotlinx-serialization 1.12.0 (stdlib 2.4.10).
#
# `android.newDsl=false` keeps the classic AGP DSL surface, which the build scripts in this
# repository are written against. Both flags are removed in AGP 10.
android.builtInKotlin=false
android.newDsl=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Build behaviour
# ---------------------------------------------------------------------------
# Release builds are signed from CI secrets; see scripts/setup-signing.sh.
#
# compileSdk must be 37: the pinned AndroidX / Compose / Ktor releases declare
# minCompileSdk 37 in their AAR metadata, so checkDebugAarMetadata fails with
# compileSdk 36. AGP 9.4.1 does not yet ship an officially-supported API 37
# target, hence the suppression below (it only silences the "unsupported SDK"
# warning; it does NOT change the runtime target).
# targetSdk stays 36 (Android 16) in both apps; the runtime behaviour changes
# that are audited in README.md are keyed off targetSdk, not compileSdk.
# When AGP formally supports API 37 this flag can be removed.
android.suppressUnsupportedCompileSdk=37
